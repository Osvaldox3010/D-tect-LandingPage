<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <title>D-TECT — Truth and Lie | Evaluaciones de control de confianza</title>
  <meta name="description" content="D-TECT: evaluaciones profesionales de poligrafía, toxicología, psicometría, estudio socioeconómico y antecedentes penales para personas y organizaciones.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="src/assets/logo/dtect-icon.webp">
  <!-- Aplica el tema ANTES de pintar la página (bloqueante, en el <head>):
       evita el "flash" de tema incorrecto al cargar (FOUC). Prioridad:
       preferencia guardada por el usuario > preferencia del sistema. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dtect-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
